{% extends "backoffice/base.html" %}
{% block content %}
<div class="page-editor" style="padding-bottom:0"><a class="ghost-button" href="{% url 'backoffice:pages' %}" style="display:inline-flex;align-items:center;gap:8px"><i class="ph ph-arrow-left"></i> Back to Pages</a></div>
<section class="pages-shell"><style>.page-editor{max-width:1000px;margin:0 auto;padding:30px}.page-editor-card{padding:28px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}.page-editor h1{margin:0 0 8px}.page-editor .subtle{color:var(--muted);margin:0 0 24px}.page-field{display:grid;gap:7px;margin-bottom:17px}.page-field label{font-weight:800}.page-field input,.page-field textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text-main)}.page-field textarea{min-height:340px;resize:vertical}.page-check{display:flex;align-items:center;gap:9px;margin:18px 0;font-weight:700}.page-check input{width:17px;height:17px;accent-color:#e04420}</style>
<div class="page-editor"><div class="page-editor-card"><p class="eyebrow">Pages / Page editor</p><h1>{% if page %}Edit page{% else %}Add page{% endif %}</h1><p class="subtle">Create privacy, terms, returns and custom storefront content.</p><form method="post">{% csrf_token %}<div class="page-field"><label>Page title</label><input name="title" value="{{ page.title|default:'' }}" placeholder="Privacy Policy" required></div><div class="page-field"><label>URL slug</label><input name="slug" value="{{ page.slug|default:'' }}" placeholder="privacy-policy" required></div><div class="page-field"><label>Page content</label><textarea name="content" placeholder="Write your page content here...">{{ page.content|default:'' }}</textarea></div><label class="page-check"><input type="checkbox" name="is_published" {% if page.is_published %}checked{% endif %}> Publish this page on the storefront</label><button class="primary-button" type="submit">Save page</button> <a class="ghost-button" href="{% url 'backoffice:pages' %}">Cancel</a></form></div></div>
</section>
<style>.page-editor-card form>.primary-button,.page-editor-card form>a.ghost-button{display:none!important}.page-save-bar{position:fixed;z-index:9999;left:290px;right:0;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:14px 30px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);box-shadow:0 -10px 28px rgba(16,24,40,.08)}.bo-sidebar.collapsed~.bo-main~.page-save-bar,.bo-sidebar.collapsed~.page-save-bar{left:92px}.page-save-bar button,.page-save-bar a{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 17px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none}.page-save-bar .stay{border:1px solid #f2b8a8;background:#fff5f1;color:#c43d20}.page-save-bar .close{border:0;background:#e04420;color:#fff}.page-save-bar .cancel{border:1px solid var(--border);background:var(--surface);color:var(--text-main)}@media(max-width:1180px){.page-save-bar,.bo-sidebar.collapsed~.bo-main~.page-save-bar{left:0}}@media(max-width:700px){.page-save-bar{padding:11px 14px;gap:7px}.page-save-bar button,.page-save-bar a{flex:1;padding:0 8px;font-size:12px}}
</style>
<div class="page-save-bar"><button class="stay" type="submit" form="page-editor-form" name="save_action" value="stay"><i class="ph ph-floppy-disk"></i> Save &amp; stay</button><button class="close" type="submit" form="page-editor-form" name="save_action" value="close"><i class="ph ph-check"></i> Save &amp; close</button><a class="cancel" href="{% url 'backoffice:pages' %}"><i class="ph ph-x"></i> Cancel</a></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('.page-editor-card form');
    if (!form) return;
    form.id = 'page-editor-form';
});
</script>
{% endblock %}
