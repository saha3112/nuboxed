<article class="storefront-store-card">
    <a href="{% url 'storefront:store-detail' slug=store.slug %}" class="storefront-store-link">
        {% if store.banner %}
            <img src="{{ store.banner.url }}" alt="{{ store.name }}" class="storefront-store-banner">
        {% endif %}
        <div class="storefront-store-copy">
            <div class="storefront-store-head">
                {% if store.logo %}
                    <img src="{{ store.logo.url }}" alt="{{ store.name }}" class="storefront-store-logo">
                {% endif %}
                <div class="storefront-store-identity">
                    <h3>{{ store.name }}</h3>
                    <p class="storefront-store-retailer">{{ store.retailer_label }}</p>
                </div>
            </div>
            {% if store.description %}
                <p class="storefront-store-description">{{ store.description|truncatechars:120 }}</p>
            {% endif %}
        </div>
    </a>
</article>
