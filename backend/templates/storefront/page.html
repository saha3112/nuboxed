{% extends "storefront/base.html" %}
{% block content %}
<style>.public-page{max-width:920px;margin:55px auto;padding:42px 48px;border:1px solid #e6e8ef;border-radius:24px;background:#fff;box-shadow:0 20px 55px rgba(16,24,40,.08)}.public-page h1{margin:0 0 14px;color:#182235;font-size:clamp(32px,5vw,54px);letter-spacing:-.04em}.public-page-content{color:#475467;font-size:16px;line-height:1.8;white-space:pre-wrap}.public-page-content a{color:#e04420;font-weight:700}@media(max-width:640px){.public-page{margin:28px 16px;padding:28px 22px}}</style>
<article class="public-page"><p class="eyebrow">Nuboxed</p><h1>{{ page.title }}</h1><div class="public-page-content">{{ page.content|safe }}</div></article>
{% endblock %}
