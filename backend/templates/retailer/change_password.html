{% extends "retailer/base.html" %}

{% block content %}
<div class="ra-card" style="max-width: 680px;">
    <div class="ra-card-header">
        <span class="ra-card-title"><i class="ph ph-lock-key" style="margin-right:6px; color:var(--primary);"></i> Change Login Password</span>
    </div>
    <div class="ra-card-body">
        <p style="color:var(--text-muted); margin-top:0;">Choose a new password for your retailer account.</p>
        <form method="post" class="ra-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="ra-field">
                    <label class="ra-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="ra-field-error">{{ field.errors.as_text }}</div>{% endif %}
                </div>
            {% endfor %}
            <div class="ra-form-actions-sticky" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
                <a href="{% url 'retailers:dashboard' %}" class="ra-btn ra-btn-outline" style="margin-right:auto;"><i class="ph ph-x"></i> Cancel</a>
                <button type="submit" class="ra-btn ra-btn-primary">Change Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
