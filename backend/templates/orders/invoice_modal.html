<style>
.invoice-modal{position:fixed;inset:0;z-index:10060;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(15,23,42,.62);backdrop-filter:blur(5px)}
.invoice-modal.is-open{display:flex}.invoice-modal-card{position:relative;width:min(1080px,96vw);height:min(920px,94vh);overflow:hidden;border:1px solid var(--line,#e2e8f0);border-radius:22px;background:var(--surface,#fff);box-shadow:0 30px 90px rgba(15,23,42,.3)}
.invoice-modal-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line,#e2e8f0);background:var(--surface,#fff);color:var(--ink,#111827)}
.invoice-modal-head strong{font-size:15px}.invoice-modal-close{width:34px;height:34px;border:1px solid var(--line,#e2e8f0);border-radius:10px;background:transparent;color:var(--muted,#64748b);font-size:20px;cursor:pointer}.invoice-modal-close:hover{background:var(--surface-soft,#f8fafc);color:var(--ink,#111827)}
.invoice-frame{width:100%;height:calc(100% - 58px);border:0;background:#edf1f5}body.dark-mode .invoice-modal-card{border-color:#334155;background:#182231}.dark-mode .invoice-modal-head{border-color:#334155;background:#182231;color:#f8fafc}
</style>
<div class="invoice-modal" id="invoice-modal" aria-hidden="true"><div class="invoice-modal-card" role="dialog" aria-modal="true" aria-label="Invoice preview"><div class="invoice-modal-head"><strong>Invoice Preview</strong><button class="invoice-modal-close" type="button" data-close-invoice aria-label="Close">×</button></div><iframe class="invoice-frame" name="invoice_frame" title="Invoice preview"></iframe></div></div>
<script>
(function(){var modal=document.getElementById('invoice-modal');if(!modal)return;function closeInvoice(){modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';}window.openInvoiceModal=function(form){modal.classList.add('is-open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';form.target='invoice_frame';return true;};document.addEventListener('submit',function(e){var form=e.target;if(form&&form.action&&form.action.indexOf('/invoice')!==-1){openInvoiceModal(form);}});modal.addEventListener('click',function(e){if(e.target===modal||e.target.closest('[data-close-invoice]'))closeInvoice();});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('is-open'))closeInvoice();});})();
</script>
