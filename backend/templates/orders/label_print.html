<!doctype html><html><head><meta charset="utf-8"><title>Delivery label {{ label.label_number }}</title><style>body{font-family:Arial;margin:20px}.label{width:100mm;min-height:65mm;border:2px solid #111;padding:15px}.number{font-size:12px;color:#666}.address{font-size:18px;line-height:1.4;margin:15px 0}li{margin:4px 0}@media print{button{display:none}}</style></head><body><button onclick="print()">Print label</button><div class="label"><div class="number">{{ label.label_number }}</div><h2>{{ label.payload.customer }}</h2><div class="address">{{ label.payload.address }}<br>{{ label.payload.phone }}</div><strong>Items</strong><ul>{% for item in label.payload.items %}<li>{{ item.name }}{% if item.variant %} — {{ item.variant }}{% endif %} × {{ item.quantity }}</li>{% endfor %}</ul></div></body></html>
