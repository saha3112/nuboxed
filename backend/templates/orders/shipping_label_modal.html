<style>
.shipping-label-modal{position:fixed;inset:0;z-index:10050;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(15,23,42,.62);backdrop-filter:blur(5px)}
.shipping-label-modal.is-open{display:flex}.shipping-label-modal-card{position:relative;width:min(610px,96vw);height:min(900px,94vh);overflow:hidden;border:1px solid var(--line,#e2e8f0);border-radius:22px;background:var(--surface,#fff);box-shadow:0 30px 90px rgba(15,23,42,.3)}
.shipping-label-modal-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line,#e2e8f0);background:var(--surface,#fff);color:var(--ink,#111827)}
.shipping-label-modal-head strong{font-size:15px}.shipping-label-modal-close{width:34px;height:34px;border:1px solid var(--line,#e2e8f0);border-radius:10px;background:transparent;color:var(--muted,#64748b);font-size:20px;cursor:pointer}.shipping-label-modal-close:hover{background:var(--surface-soft,#f8fafc);color:var(--ink,#111827)}
.shipping-label-frame{width:100%;height:calc(100% - 58px);border:0;background:#edf1f5}
body.dark-mode .shipping-label-modal-card{border-color:#334155;background:#182231}.dark-mode .shipping-label-modal-head{border-color:#334155;background:#182231;color:#f8fafc}
</style>
<div class="shipping-label-modal" id="shipping-label-modal" aria-hidden="true">
  <div class="shipping-label-modal-card" role="dialog" aria-modal="true" aria-label="Shipping label preview">
    <div class="shipping-label-modal-head"><strong>Shipping Label Preview</strong><button class="shipping-label-modal-close" type="button" data-close-shipping-label aria-label="Close">×</button></div>
    <iframe class="shipping-label-frame" name="shipping_label_frame" title="Shipping label preview"></iframe>
  </div>
</div>
<script>
(function(){
  var modal=document.getElementById('shipping-label-modal');
  if(!modal)return;
  function closeLabel(){modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  window.openShippingLabelModal=function(form){modal.classList.add('is-open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';form.target='shipping_label_frame';return true;};
  modal.addEventListener('click',function(e){if(e.target===modal||e.target.closest('[data-close-shipping-label]'))closeLabel();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('is-open'))closeLabel();});
})();
</script>
