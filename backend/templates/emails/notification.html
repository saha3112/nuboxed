<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#172033;">
    <div style="padding:36px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e6eaf0;border-radius:18px;overflow:hidden;">
            <tr><td style="height:5px;background:#e04420;font-size:0;line-height:0;">&nbsp;</td></tr>
            <tr><td style="padding:30px 34px 18px;text-align:center;">
                {% if has_logo %}<img src="cid:{{ logo_cid }}" width="150" alt="{{ brand_name }}" style="display:inline-block;max-width:150px;max-height:58px;width:auto;height:auto;object-fit:contain;border:0;">{% else %}<div style="display:inline-block;color:#172033;font-size:26px;font-weight:800;">{{ brand_name }}</div>{% endif %}
            </td></tr>
            <tr><td style="padding:0 34px 32px;">
                <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3;color:#172033;">{{ subject }}</h1>
                <div style="font-size:15px;line-height:1.75;color:#667085;">{{ body|linebreaksbr }}</div>
            </td></tr>
            <tr><td style="padding:18px 34px;border-top:1px solid #eef1f4;text-align:center;color:#98a2b3;font-size:12px;line-height:1.6;">You received this email from {{ brand_name }}.</td></tr>
        </table>
    </div>
</body>
</html>
